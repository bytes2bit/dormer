[package]
name = "dormer"
version = "0.2.0"
edition = "2021"
description = "A window in the roof: a living wallpaper of rooftops under the real sky, weather and week"
readme = "README.md"
keywords = ["wallpaper", "wayland", "hyprland", "generative", "weather"]
categories = ["command-line-utilities", "graphics"]

[dependencies]
libc = "0.2"
png = "0.17"
serde_json = "1"
toml = { version = "0.8", default-features = false, features = ["parse"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 2
