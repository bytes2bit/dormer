# dormer — every setting, with its default. Copy what you need to
# ~/.config/dormer/config.toml; an absent file means all of these.
# `dormer doctor` shows what is in effect.

[place]
# Where the sky is. Left out, dormer uses the Noctalia shell's location if it
# is running, and otherwise Greenwich.
# latitude = 35.78
# longitude = -5.79
# name = "Tangier"

[look]
view = "rooftops"        # rooftops | street | city | coast | moon; `dormer view NAME` overrides this
seed = 12                # a different number is a different old town (rooftops only)
size = "auto"            # or "2560x1600"; auto is your largest screen
mode = "auto"            # dark | light | auto (follow the desktop)
top_dark = "#1A2027"     # the sky fades into this at the top: use your bar's colour
top_light = "#ECEFEE"

[wallpaper]
backend = "auto"         # noctalia | swww | hyprpaper | command | auto
command = ""             # for "command", e.g. "swaybg -m fill -i {path}"

[weather]
source = "auto"          # noctalia | open-meteo | none | auto

[house]
lamp = ["claude", "codex"]   # the lamp is lit while a process with one of these names runs
containers = true            # one blue window for each running Docker container

[live]
fps = 30
interactive = true          # mouse reactions on the exposed wallpaper; false passes clicks to desktop icons beneath it

[activity]
birds = 1.0              # how often visitors turn up, as a multiple of the usual (0 to 20)
meteors = 1.0
planes = 1.0
stories = true           # incidents and daily life in the developed views

# Inputs follow reality unless fixed here. Leave a key out and it stays live.
# Saving from `dormer dev` writes these; so can you. A running `dormer live`
# follows changes to this file without a restart, except [place], [wallpaper],
# [weather], [house], [power], [dev], and [look] seed/size/top_*, which are read
# at start.
[scene]
# time = "21:30"         # a fixed local time of day (HH:MM)
# date = "2026-10-15"    # a fixed calendar date (YYYY-MM-DD); the time of day keeps moving
# cloud = 40             # percent
# rain = 0               # percent
# snow = 0
# fog = 0
# storm = false
# rain_in = 4            # hours until rain; 4 means none in sight
# wind = 10              # km/h
# wind_from = 270        # degrees
# temperature = 14       # Celsius
# humidity = 60          # percent

# Simulation values for what the house shows. Not readings from this machine.
[scene.simulated_machine]
# agents = 1             # the lamp
# containers = 2         # blue windows
# load = 20              # percent: smoke
# music = false

# Knobs of a single view, as the dev panel offers them.
# [views.coast]
# tide = 0.5

[power]
hold_file = ""           # while this file exists the wallpaper holds still (e.g. a battery-saver flag)

[dev]
terminal = ""            # ghostty | kitty | foot | alacritty | wezterm; empty is $TERMINAL or the first found
